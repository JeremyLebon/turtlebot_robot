# /etc/rpi/swap.conf.d/50-turtlebot.conf - geïnstalleerd door setup_turtlebot.sh
# Enkel zram (gecomprimeerde swap in het RAM, 2 GB): geen writeback-bestand
# /var/swap van 2 GB op de SD-kaart (Pi 5 met 8 GB RAM gebruikt <1 GB; de
# 32 GB-kaart van turtlebot09 zat vol). Het bestand verdwijnt bij de volgende
# herstart. Terug naar de standaard: dit bestand verwijderen + herstarten.
[Main]
Mechanism=zram
