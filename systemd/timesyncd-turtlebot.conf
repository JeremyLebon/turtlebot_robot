# /etc/systemd/timesyncd.conf.d/50-turtlebot.conf (geïnstalleerd door
# setup_turtlebot.sh). De robot heeft internet via de WAN van zijn AP; de
# RTC van de Pi 5 houdt de tijd bij tussen twee synchronisaties.
# Juiste tijd is belangrijk voor ROS: TF/rviz op de laptop gooien berichten
# weg als de tijdstempels van robot en laptop te ver uit elkaar liggen.
[Time]
NTP=0.be.pool.ntp.org 1.be.pool.ntp.org 2.be.pool.ntp.org
FallbackNTP=0.debian.pool.ntp.org 1.debian.pool.ntp.org 2.debian.pool.ntp.org
